<div class="settings-page">
  
  <!-- Header -->
  <div class="page-header">
    <div class="header-titles">
      <h1 class="page-title">Admin Profile & Settings</h1>
      <p class="page-subtitle">Update your personal account credentials, department info, and security preferences</p>
    </div>
  </div>

  @if (successMessage()) {
    <div class="alert alert-success">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      <span>{{ successMessage() }}</span>
    </div>
  }

  @if (errorMessage()) {
    <div class="alert alert-danger">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span>{{ errorMessage() }}</span>
    </div>
  }

  <div class="settings-grid">
    
    <!-- Profile Card -->
    <div class="settings-card">
      <div class="card-header">
        <h3 class="card-title">Profile Information</h3>
      </div>
      <div class="card-body">
        <div class="form-grid">
          <div class="form-group col-span-2">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" [ngModel]="name()" (ngModelChange)="name.set($event)" />
          </div>

          <div class="form-group col-span-2">
            <label class="form-label">Email Address (Read-only)</label>
            <input type="email" class="form-control" [ngModel]="email()" disabled />
          </div>

          <div class="form-group">
            <label class="form-label">Role</label>
            <input type="text" class="form-control" [value]="currentUser()?.role" disabled />
          </div>

          <div class="form-group">
            <label class="form-label">Department</label>
            <input type="text" class="form-control" [ngModel]="department()" (ngModelChange)="department.set($event)" />
          </div>

          <div class="form-group col-span-2">
            <label class="form-label">Phone Contact</label>
            <input type="text" class="form-control" [ngModel]="phone()" (ngModelChange)="phone.set($event)" />
          </div>
        </div>
      </div>
    </div>

    <!-- Security & Password Card -->
    <div class="settings-card">
      <div class="card-header">
        <h3 class="card-title">Security & Password</h3>
      </div>
      <div class="card-body">
        <div class="form-grid">
          <div class="form-group col-span-2">
            <label class="form-label">Current Password (required if changing password)</label>
            <input type="password" class="form-control" [ngModel]="currentPassword()" (ngModelChange)="currentPassword.set($event)" placeholder="••••••••" />
          </div>

          <div class="form-group">
            <label class="form-label">New Password</label>
            <input type="password" class="form-control" [ngModel]="newPassword()" (ngModelChange)="newPassword.set($event)" placeholder="••••••••" />
          </div>

          <div class="form-group">
            <label class="form-label">Confirm New Password</label>
            <input type="password" class="form-control" [ngModel]="confirmPassword()" (ngModelChange)="confirmPassword.set($event)" placeholder="••••••••" />
          </div>
        </div>

        <div class="mt-4">
          <button class="btn btn-primary" (click)="saveProfile()" [disabled]="isLoading()">
            {{ isLoading() ? 'Saving Changes...' : 'Save Settings' }}
          </button>
        </div>
      </div>
    </div>

  </div>

</div>
