<div class="login-page-container">
  <div class="login-card">
    
    <!-- Header with Branding -->
    <div class="login-header">
      <div class="login-brand-icon">
        <svg viewBox="0 0 40 40" fill="none" class="vic-icon-svg">
          <rect width="40" height="40" rx="10" fill="#0B2A4A" />
          <path d="M12 28L20 12L28 28H23L20 22L17 28H12Z" fill="#0D8A8A" />
          <circle cx="20" cy="18" r="3" fill="#FFFFFF" />
        </svg>
      </div>
      <h1 class="login-title">VIC Admin Portal</h1>
      <p class="login-subtitle">Vaccine Industrial Company • Saudi Arabia</p>
    </div>

    @if (errorMessage()) {
      <div class="login-alert-error">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <!-- Login Form -->
    <form (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label class="form-label" for="login-email">Email Address</label>
        <div class="input-with-icon">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
          </span>
          <input
            id="login-email"
            type="email"
            class="form-control"
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
            name="email"
            placeholder="admin@vic.com.sa"
            required
            autocomplete="email"
          />
        </div>
      </div>

      <div class="form-group">
        <div class="label-row">
          <label class="form-label" for="login-password">Password</label>
        </div>
        <div class="input-with-icon">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <input
            id="login-password"
            [type]="showPassword() ? 'text' : 'password'"
            class="form-control"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            name="password"
            placeholder="••••••••"
            required
            autocomplete="current-password"
          />
          <button type="button" class="btn-toggle-pw" (click)="togglePasswordVisibility()">
            @if (showPassword()) {
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            } @else {
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            }
          </button>
        </div>
      </div>

      <!-- Demo Credentials hint -->
      <div class="demo-hint-box">
        <span class="hint-title">Default Admin Credentials:</span>
        <span class="hint-value">User: <strong>admin&#64;vic.com.sa</strong> &bull; Pass: <strong>Admin&#64;123</strong></span>
      </div>

      <button type="submit" class="btn-login-submit" [disabled]="isLoading()">
        @if (isLoading()) {
          <span class="spinner-small"></span> Authenticating...
        } @else {
          Sign In to Admin Console
        }
      </button>

      <div class="login-footer-links">
        <a routerLink="/" class="back-link">&larr; Return to Public Website</a>
      </div>
    </form>

  </div>
</div>
