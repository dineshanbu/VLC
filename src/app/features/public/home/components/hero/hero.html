<section class="hero-wrapper">
  <div class="hero">
    <div class="hero__media-wrapper">
      <video
        #heroVideo
        class="hero__video"
        src="about.mp4"
        autoplay
        loop
        muted
        playsinline
        preload="metadata"
        poster="vc-company.jpg"
        aria-label="Vaccine manufacturing production line"
        (canplay)="playHeroVideo()"
      ></video>
      <div class="hero__gradient-overlay" aria-hidden="true"></div>
    </div>

    <div class="hero__banner-content">
      <img
        class="hero__banner-logo"
        src="https://vaccine.com.sa/wp-content/uploads/2024/03/Vaccine-Website-White-Logo.png"
        alt="Vaccine Industrial Company"
      />
      <span class="hero__banner-divider" aria-hidden="true"></span>
      <div class="hero__banner-copy">
        <h1 class="hero__banner-title">
          @if (isRtl) {
            أكبر منشأة للقاحات البشرية في الشرق الأوسط
          } @else {
            The largest human vaccines facility in the <span class="hero__banner-title-accent">Middle East</span>
          }
        </h1>
        <button class="hero__btn-video" type="button" (click)="openVideoModal()">
          <span class="hero__play-icon-circle" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="m9 6 9 6-9 6V6Z" /></svg></span>
          <span>{{ isRtl ? 'شاهد فيلم الشركة' : 'Watch Corporate Film' }}</span>
        </button>
      </div>
    </div>

    <a class="hero__scroll" href="#about-vic" [attr.aria-label]="isRtl ? 'مرر للاستكشاف' : 'Scroll to explore'">
      <span class="hero__scroll-arrow-wrap" aria-hidden="true">
        <svg class="hero__scroll-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </span>
    </a>
  </div>
</section>

@if (isModalOpen()) {
  <div class="hero-video-modal" role="dialog" aria-modal="true" [attr.aria-label]="isRtl ? 'فيلم الشركة' : 'Corporate film'" (keydown)="onModalKeydown($event)">
    <button class="hero-video-modal__backdrop" type="button" aria-label="Close video" (click)="closeVideoModal()"></button>
    <div class="hero-video-modal__dialog">
      <div class="hero-video-modal__header">
        <span class="hero-video-modal__tag">{{ isRtl ? 'فيلم الشركة' : 'CORPORATE FILM' }}</span>
        <button class="hero-video-modal__close-btn" type="button" aria-label="Close video" (click)="closeVideoModal()">×</button>
      </div>
      <div class="hero-video-modal__player"><video #modalVideo class="hero-video-modal__video" src="watch.mp4" controls playsinline></video></div>
    </div>
  </div>
}
