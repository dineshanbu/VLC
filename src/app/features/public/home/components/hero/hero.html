<section class="hero">

  <!-- Background Master Banner Image (IMAGE 3) -->
  <div class="hero__image-wrapper">
    <img
      src="home_banner.png"
      alt="VIC Manufacturing Facility — State-of-the-art vaccine production center"
      class="hero__image"
    />
    <div class="hero__overlay"></div>
  </div>

  <!-- Content Section -->
  <div class="hero__container">
    <div class="hero__content">

      <h1 class="hero__heading">
        <span class="hero__heading-line">Protecting Lives.</span>
        <span class="hero__heading-line">Building</span>
        <span class="hero__heading-line">Healthier <span class="hero__heading-accent">Futures.</span></span>
      </h1>

      <p class="hero__description">
        Saudi Arabia's next-generation vaccine manufacturing company, advancing innovation, localization and global health.
      </p>

      <div class="hero__actions">
        <button class="btn btn-secondary hero__btn-video" type="button" (click)="scrollToVideo()">
          <span class="hero__btn-lead-icon">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="6 4 20 12 6 20 6 4"></polygon>
            </svg>
          </span>
          <span class="hero__btn-label">Watch Corporate Video</span>
          <span class="hero__play-icon">
            <svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="7 4 19 12 7 20 7 4"></polygon>
            </svg>
          </span>
        </button>
      </div>

    </div>
  </div>

</section>
