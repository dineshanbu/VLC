<section class="about-vic" id="about-vic">
  <img class="about-vic__brand-mark" src="v-floating-mark.png" alt="" aria-hidden="true" />
  <div class="about-vic__container">

    <div class="about-vic__grid">

      <!-- Left Content Column -->
      <div class="about-vic__content">
        <!-- Eyebrow label with horizontal accent line -->
        <div class="about-vic__eyebrow-wrapper">
          <span class="about-vic__eyebrow">{{ translationService.translate('aboutVic.eyebrow') }}</span>
          <span class="about-vic__eyebrow-line" aria-hidden="true"></span>
        </div>

        <h2 class="about-vic__heading">
          {{ translationService.translate('aboutVic.headingLine1') }}<br>
          {{ translationService.translate('aboutVic.headingLine2') }}
        </h2>

        <p class="about-vic__desc">
          {{ translationService.translate('aboutVic.desc') }}
        </p>

        <div class="about-vic__action">
          <a routerLink="/about" class="about-vic__btn">
            <span>{{ translationService.translate('aboutVic.btn') }}</span>
            <svg class="about-vic__btn-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </a>
        </div>
      </div>

      <!-- Right Media Column with curved organic mask & floating badge -->
      <div class="about-vic__media-wrapper">
        <div class="about-vic__curved-media">
          <img class="about-vic__image" src="vc-company.jpg" alt="Vaccine Industrial Company facility" loading="lazy" />
        </div>
      </div>

    </div>

  </div>
</section>
