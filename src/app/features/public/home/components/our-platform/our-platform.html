<section class="platform" id="platform">
  <div class="platform__container">

    <!-- Centered Eyebrow Heading -->
    <div class="platform__label-wrap">
      <span class="platform__label">OUR PLATFORM</span>
    </div>

    <!-- Carousel Outer Wrapper for Floating Side Arrows -->
    <div class="platform__carousel-wrapper">
      
      <!-- Floating Glass Prev Arrow (Left Side) -->
      <button
        type="button"
        class="platform__floating-btn platform__floating-btn--prev"
        (click)="prevSlide()"
        aria-label="Previous platform slide"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>

      <!-- 3 Cards Grid (Desktop: 3 in row | Mobile: Swipeable Carousel) -->
      <div
        #carouselTrack
        class="platform__grid"
        (scroll)="onScroll($event)"
        (touchstart)="pauseAutoplay()"
        (touchend)="resumeAutoplay()"
        (mouseenter)="pauseAutoplay()"
        (mouseleave)="resumeAutoplay()"
      >
        @for (card of cards; track card.title) {
          <a [routerLink]="card.route" class="platform__card">

            <!-- Card Full Background Image -->
            <img
              [src]="card.image"
              [alt]="card.alt"
              class="platform__image"
              [style.object-position]="card.imagePosition || 'center'"
            />

            <!-- Dark Left Gradient Overlay for High Text Readability -->
            <div class="platform__overlay" aria-hidden="true"></div>

            <!-- Card Content Layer -->
            <div class="platform__content">
              
              <!-- Top Header: Number + Tag -->
              <div class="platform__card-header">
                <span class="platform__card-num">{{ card.number }}</span>
                <span class="platform__card-tag" [style.color]="card.tagColor">{{ card.tag }}</span>
              </div>

              <!-- Title & Description -->
              <div class="platform__card-body">
                <h3 class="platform__card-title">{{ card.title }}</h3>
                <p class="platform__card-desc">{{ card.description }}</p>
              </div>

              <!-- Bottom Right Circular Arrow Button -->
              <div class="platform__card-arrow" aria-hidden="true">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                  <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
              </div>

            </div>

          </a>
        }
      </div>

      <!-- Floating Glass Next Arrow (Right Side) -->
      <button
        type="button"
        class="platform__floating-btn platform__floating-btn--next"
        (click)="nextSlide()"
        aria-label="Next platform slide"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>

    </div>

    <!-- Mobile Indicator Dots Underneath -->
    <div class="platform__mobile-dots" aria-hidden="true">
      @for (card of cards; track card.number; let idx = $index) {
        <button
          type="button"
          class="platform__dot"
          [class.platform__dot--active]="activeIndex() === idx"
          (click)="scrollToIndex(idx)"
          [attr.aria-label]="'Go to slide ' + (idx + 1)"
        ></button>
      }
    </div>

  </div>
</section>
