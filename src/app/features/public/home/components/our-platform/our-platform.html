<section class="platform" id="platform">
  <div class="platform__container">

    <!-- Centered Eyebrow Heading -->
    <div class="platform__label-wrap">
      <span class="platform__label">OUR PLATFORM</span>
    </div>

    <!-- 3 Cards Grid (Desktop: 3 in one row) -->
    <div class="platform__grid">
      @for (card of cards; track card.title) {
        <a [routerLink]="card.route" class="platform__card">

          <!-- Large Image at the Top -->
          <div class="platform__image-wrap">
            <img
              [src]="card.image"
              [alt]="card.alt"
              class="platform__image"
              [style.object-position]="card.imagePosition || 'center'"
            />
          </div>

          <!-- Circular Floating Icon Badge Overlapping Image & Content -->
          <div class="platform__icon-badge" aria-hidden="true">
            @if (card.iconType === 'molecule') {
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M12 3v3m0 12v3M3 12h3m12 0h3m-3.5-6.5l-2.1 2.1m-6.8 6.8l-2.1 2.1m0-11l2.1 2.1m6.8 6.8l2.1 2.1"></path>
                <circle cx="12" cy="3" r="1.5"></circle>
                <circle cx="12" cy="21" r="1.5"></circle>
                <circle cx="3" cy="12" r="1.5"></circle>
                <circle cx="21" cy="12" r="1.5"></circle>
              </svg>
            } @else if (card.iconType === 'flask') {
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2"></path>
                <path d="M8.5 2h7"></path>
                <path d="M7 16h10"></path>
              </svg>
            } @else {
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <path d="m18 2 4 4"></path>
                <path d="m17 7 3-3"></path>
                <path d="M19 9 8.7 19.3c-.4.4-1 .4-1.4 0l-2.6-2.6c-.4-.4-.4-1 0-1.4L15 5"></path>
                <path d="m9 11 4 4"></path>
                <path d="m5 19-3 3"></path>
                <path d="m14 4 6 6"></path>
              </svg>
            }
          </div>

          <!-- White Content Panel (Straight clean rectangle, close title-to-desc spacing) -->
          <div class="platform__body">
            <h3 class="platform__card-title">{{ card.title }}</h3>

            <p class="platform__card-desc">{{ card.description }}</p>

            <!-- Bottom Action: Read More with Arrow -->
            <div class="platform__card-action">
              <span class="platform__read-more">Read More</span>
              <svg class="platform__arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="4" y1="12" x2="20" y2="12"></line>
                <polyline points="13 5 20 12 13 19"></polyline>
              </svg>
            </div>
          </div>

        </a>
      }
    </div>

  </div>
</section>
