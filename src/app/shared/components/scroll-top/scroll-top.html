<button
  type="button"
  class="vic-scroll-top-btn"
  [class.is-visible]="isVisible()"
  (click)="scrollToTop()"
  [attr.aria-label]="'Scroll back to top (' + progressPercentage() + '% scrolled)'"
  [attr.title]="'Scroll to top (' + progressPercentage() + '%)'"
>
  <!-- Circular Progress Track and Fill Indicator -->
  <svg class="vic-scroll-top__svg" viewBox="0 0 48 48" aria-hidden="true">
    <!-- Background Track Ring -->
    <circle
      class="vic-scroll-top__track"
      cx="24"
      cy="24"
      r="20"
    />
    <!-- Dynamic Progress Bar Ring (fills clockwise from top) -->
    <circle
      class="vic-scroll-top__bar"
      cx="24"
      cy="24"
      r="20"
      [style.strokeDashoffset]="dashOffset()"
    />
  </svg>

  <!-- Centered Crisp White Chevron Up Arrow -->
  <span class="vic-scroll-top__icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="18 15 12 9 6 15" />
    </svg>
  </span>
</button>
