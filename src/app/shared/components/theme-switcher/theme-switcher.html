<div class="theme-control">
  <button type="button" class="theme-control__trigger" (click)="theme.togglePanel()" [attr.aria-expanded]="theme.isPanelOpen()" aria-label="Open theme settings" title="Theme settings">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v2m0 14v2M3 12h2m14 0h2m-3.64-5.36 1.42-1.42M5.22 18.78l1.42-1.42m0-10.14L5.22 5.8m13.56 12.98-1.42-1.42"/><circle cx="12" cy="12" r="4"/></svg>
  </button>

  @if (theme.isPanelOpen()) {
    <section class="theme-panel" aria-label="Theme settings">
      <div class="theme-panel__heading"><span>Appearance</span><button type="button" (click)="theme.closePanel()" aria-label="Close theme settings">×</button></div>
      <p>Choose a display mode and accent color. Your preference is saved automatically.</p>
      <span class="theme-panel__label">Mode</span>
      <div class="theme-panel__modes">
        @for (mode of modes; track mode.value) {
          <button type="button" [class.is-active]="theme.preference().mode === mode.value" (click)="theme.setMode(mode.value)"><span>{{ mode.icon }}</span>{{ mode.label }}</button>
        }
      </div>
      <span class="theme-panel__label">Color theme</span>
      <div class="theme-panel__palettes">
        @for (palette of palettes; track palette.value) {
          <button type="button" [class.is-active]="theme.preference().palette === palette.value" (click)="theme.setPalette(palette.value)"><i [style.background]="palette.color"></i>{{ palette.label }}</button>
        }
      </div>
      <label class="theme-panel__custom">Custom accent <input type="color" [value]="theme.preference().customColor" (input)="chooseColor($event)" aria-label="Custom accent color"></label>
    </section>
  }
</div>
